# =============================================================================
# NEFROAI-X — Docker Compose Configuration (Full-Stack FastAPI + React SPA)
# =============================================================================

services:
  nefroai-x:
    build:
      context: .
      dockerfile: Dockerfile
    image: nefroai-x:latest
    container_name: nefroai-x-app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONPATH=/app/src:/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - MPLCONFIGDIR=/tmp/matplotlib
      - PORT=8000
    volumes:
      - nefroai_reports:/app/reports
      - nefroai_runs:/app/runs/explainability/plots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  nefroai_reports:
    name: nefroai_reports
  nefroai_runs:
    name: nefroai_runs
