<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <title>Kidney Stone</title>
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="" name="keywords">
        <meta content="" name="description">

        <!-- Google Web Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <!-- Icon Font Stylesheet -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">


        <!-- Libraries Stylesheet -->
        <link href="static/lib/animate/animate.min.css" rel="stylesheet">
        <link href="static/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">


        <!-- Customized Bootstrap Stylesheet -->
        <link href="static/css/bootstrap.min.css" rel="stylesheet">

        <!-- Template Stylesheet -->
        <link href="static/css/style.css" rel="stylesheet">
    </head>
    <body>

        <!-- Spinner Start -->
        <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <!-- Spinner End -->

        <!-- Navbar & Hero Start -->
        <div class="container-fluid position-relative p-0">
            <nav class="navbar navbar-expand-lg navbar-light px-4 px-lg-5 py-3 py-lg-0">
                <a href="#" class="navbar-brand p-0">
                    <h1 class="text-primary"><i class="fa-solid fa-heart-pulse me-3"></i>Kidney Stone</h1>
                    <!-- <img src="static/img/logo.png" alt="Logo"> -->
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                    <span class="fa fa-bars"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <div class="navbar-nav ms-auto py-0">
                        {% include 'menu/home.html'  %}
                    </div>

                </div>
            </nav>

            <!-- Header Start -->
            <div class="container-fluid bg-breadcrumb">
                <div class="container text-center py-5" style="max-width: 900px;">
                    <h4 class="text-white display-4 mb-4 wow fadeInDown" data-wow-delay="0.1s">Home</h4>

                </div>
            </div>
            <!-- Header End -->
        </div>
        <!-- Navbar & Hero End -->



        <!-- Contact Start -->
        <div class="container-fluid contact bg-light py-5">
            <div class="container py-5">
                <div class="row g-5">
                    <div class="col-lg-6 wow fadeInUp" data-wow-delay="0.4s">
                        <div class="row g-4">
                            <div class="col-12">

                                <img src="static/Logins/View2.jpg" alt="Noting" class="img1" style="width: 100%; height: 1000px; object-fit: cover;">

                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 h-100 wow fadeInUp" data-wow-delay="0.2s">
                        <div class="text-center mx-auto pb-5" style="max-width: 800px;">
                            <h4 class="text-uppercase text-primary">Register</h4>
                            <h1 class="display-3 text-capitalize mb-3">User</h1>
                        </div>
          <form action="/newuser" method="post">
    <div class="row g-4">

        <div class="col-12">
            <div class="form-floating">
                <input type="text" name="name" class="form-control border-0" id="Name" placeholder="Name" required>
                <label for="Name">Name</label>
            </div>
        </div>

        <div class="col-12">
            <label class="form-label fw-bold">Gender</label><br>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="Male" value="male" required>
                <label class="form-check-label" for="Male">Male</label>
            </div>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="Female" value="female">
                <label class="form-check-label" for="Female">Female</label>
            </div>
        </div>

        <div class="col-12">
            <div class="form-floating">
                <input type="number" name="age" class="form-control border-0" id="Age" placeholder="Age" required>
                <label for="Age">Age</label>
            </div>
        </div>

        <div class="col-12">
            <div class="form-floating">
                <input type="email" name="email" class="form-control border-0" id="Email" placeholder="Email" required>
                <label for="Email">Email</label>
            </div>
        </div>

        <div class="col-12">
            <div class="form-floating">
                <input type="text" name="mobile" class="form-control border-0" id="Mobile" placeholder="Mobile Number" required>
                <label for="Mobile">Mobile Number</label>
            </div>
        </div>

        <div class="col-12">
            <div class="form-floating">
                <textarea class="form-control border-0"
                          name="address"
                          id="Address"
                          placeholder="Address"
                          style="height: 150px;"
                          required></textarea>
                <label for="Address">Address</label>
            </div>
        </div>

        <div class="col-12">
            <div class="form-floating">
                <input type="text" name="uname" class="form-control border-0" id="UserName" placeholder="UserName" required>
                <label for="UserName">User Name</label>
            </div>
        </div>

        <div class="col-12">
            <div class="form-floating">
                <input type="password" name="pas" class="form-control border-0" id="Password" placeholder="Password" required>
                <label for="Password">Password</label>
            </div>
        </div>

        <div class="col-12 d-flex justify-content-center gap-3">
            <button class="btn btn-primary px-5 py-3" type="submit">
                Submit
            </button>

            <button class="btn btn-secondary px-5 py-3" type="reset">
                Reset
            </button>
        </div>

        <div class="col-12 text-center">
            <a class="link" href="/UserLogin">Already have an account? Login</a>
        </div>

    </div>
</form>
                    </div>

                </div>
            </div>
        </div>
        <!-- Contact End -->



        <!-- Copyright Start -->
         <div class="container-fluid copyright py-4">
            <div class="container">
                <div class="row g-4 align-items-center">
                    <div class="col-md-6 text-center text-md-start mb-md-0">
                        <span class="text-body"><a href="#" class="border-bottom text-white"><i class="fas fa-copyright text-light me-2"></i>Kidney Stone</a>, All right reserved.</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- Copyright End -->


        <!-- Back to Top -->
        <a href="#" class="btn btn-secondary btn-lg-square rounded-circle back-to-top"><i class="fa fa-arrow-up"></i></a>


     <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/lib/wow/wow.min.js"></script>
    <script src="static/lib/easing/easing.min.js"></script>
    <script src="static/lib/waypoints/waypoints.min.js"></script>
    <script src="static/lib/counterup/counterup.min.js"></script>
    <script src="static/lib/owlcarousel/owl.carousel.min.js"></script>


    <!-- Template Javascript -->
    <script src="static/js/main.js"></script>

    {% include 'menu/flash.html'  %}


    </body>

</html>
